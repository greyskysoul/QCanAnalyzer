name: Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (MinGW 8.1 / Qt 5.15.2)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        shell: pwsh
        run: |
          git lfs install --local
          git lfs pull
          $dll = Get-Item third_party\pcan\PCANBasic.dll
          if ($dll.Length -lt 1000) { throw "LFS file not materialized: $($dll.Length) bytes" }
          Write-Host "LFS OK: PCANBasic.dll = $($dll.Length) bytes"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Qt 5.15.2 + MinGW 8.1
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade aqtinstall
          foreach ($attempt in 1..3) {
            try {
              python -m aqt install-qt windows desktop 5.15.2 win64_mingw81 -O $env:RUNNER_TEMP\Qt
              python -m aqt install-tool windows desktop tools_mingw qt.tools.win64_mingw810 -O $env:RUNNER_TEMP\Qt
              break
            } catch {
              if ($attempt -lt 3) {
                Write-Host "Qt install failed (attempt $attempt/3), cleaning up and retrying..."
                if (Test-Path "$env:RUNNER_TEMP\Qt") { Remove-Item "$env:RUNNER_TEMP\Qt" -Recurse -Force }
                Start-Sleep -Seconds 10
              } else {
                throw
              }
            }
          }

      - name: Clone dependencies
        shell: pwsh
        run: |
          git clone --depth 1 --branch 4.5.0 https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System.git libs/Qt-Advanced-Docking-System
          git clone --depth 1 https://github.com/Simsys/qhexedit2.git libs/qhexedit2

      - name: Generate ads_version.h
        shell: pwsh
        run: |
          Copy-Item "ci\ads_version.h" "libs\Qt-Advanced-Docking-System\src\ads_version.h"
          Get-Content "libs\Qt-Advanced-Docking-System\src\ads_version.h" | Select-Object -First 1

      - name: Build (Release)
        shell: pwsh
        run: |
          $env:QTDIR = "$env:RUNNER_TEMP\Qt\5.15.2\mingw81_64"
          $env:PATH = "$env:RUNNER_TEMP\Qt\Tools\mingw810_64\bin;$env:QTDIR\bin;$env:PATH"
          New-Item -ItemType Directory build | Out-Null
          Push-Location build
          qmake "CONFIG+=release" ../QCanAnalyzer.pro
          $jobs = if ($env:NUMBER_OF_PROCESSORS) { $env:NUMBER_OF_PROCESSORS } else { 4 }
          mingw32-make "-j$jobs"
          Pop-Location

      - name: Package (windeployqt + device DLLs)
        shell: pwsh
        run: |
          $env:QTDIR = "$env:RUNNER_TEMP\Qt\5.15.2\mingw81_64"
          $env:PATH = "$env:RUNNER_TEMP\Qt\Tools\mingw810_64\bin;$env:QTDIR\bin;$env:PATH"
          $exeDir = "build\release"
          windeployqt --dir "$exeDir" "$exeDir\QCanAnalyzer.exe"
          Copy-Item "$env:RUNNER_TEMP\Qt\Tools\mingw810_64\bin\libgcc_s_seh-1.dll" "$exeDir"
          Copy-Item "$env:RUNNER_TEMP\Qt\Tools\mingw810_64\bin\libstdc++-6.dll" "$exeDir"
          Copy-Item "$env:RUNNER_TEMP\Qt\Tools\mingw810_64\bin\libwinpthread-1.dll" "$exeDir"
          Copy-Item third_party\pcan\PCANBasic.dll "$exeDir"
          Copy-Item third_party\zcanfd\ControlCANFD.dll "$exeDir"
          Copy-Item third_party\zcan\ControlCAN.dll "$exeDir"
          Compress-Archive -Path "$exeDir\*" -DestinationPath "QCanAnalyzer-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QCanAnalyzer-windows-x64
          path: QCanAnalyzer-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Linux (GCC / Qt 5.15.2)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs install --local
          git lfs pull
          size=$(stat -c%s third_party/zcanfd/libControlCANFD.a)
          if [ "$size" -lt 1000 ]; then echo "LFS file not materialized ($size bytes)"; exit 1; fi
          echo "LFS OK: libControlCANFD.a = $size bytes"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxcb1-dev libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxkbcommon-x11-0 libdbus-1-3 libegl1-mesa libusb-1.0-0-dev \
            libusb-dev patchelf file

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Qt 5.15.2
        run: |
          python3 -m pip install --upgrade aqtinstall
          for attempt in 1 2 3; do
            if python3 -m aqt install-qt linux desktop 5.15.2 gcc_64 -O $HOME/Qt; then
              break
            else
              echo "Qt install failed (attempt $attempt/3), cleaning up and retrying..."
              rm -rf $HOME/Qt
              sleep 10
            fi
          done
          test -f $HOME/Qt/5.15.2/gcc_64/bin/qmake

      - name: Clone dependencies
        run: |
          git clone --depth 1 --branch 4.5.0 https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System.git libs/Qt-Advanced-Docking-System
          git clone --depth 1 https://github.com/Simsys/qhexedit2.git libs/qhexedit2

      - name: Generate ads_version.h
        run: |
          cp ci/ads_version.h libs/Qt-Advanced-Docking-System/src/ads_version.h
          head -1 libs/Qt-Advanced-Docking-System/src/ads_version.h

      - name: Build (Release)
        run: |
          export QTDIR=$HOME/Qt/5.15.2/gcc_64
          export PATH=$QTDIR/bin:$PATH
          mkdir -p build
          cd build
          qmake "CONFIG+=release" ../QCanAnalyzer.pro
          make -j$(nproc)

      - name: Package (AppImage)
        run: |
          export QTDIR=$HOME/Qt/5.15.2/gcc_64
          export PATH=$QTDIR/bin:$PATH
          cd build
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          cp release/QCanAnalyzer AppDir/usr/bin/
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp ../qcanalyzer.desktop AppDir/usr/share/applications/
          cp ../icon.png AppDir/usr/share/icons/hicolor/256x256/apps/
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QCanAnalyzer-linux-x86_64
          path: build/QCanAnalyzer-*.AppImage
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true